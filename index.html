ll='%231a1509'/%3E%3Crect x='24' y='28' width='4' height='4' fill='%231a1509'/%3E%3Crect x='28' y='28' width='4' height='4' fill='%231a1509'/%3E%3C/svg%3E">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --wood-dark: #2c1a0e;
            --wood: #5b3a22;
            --wood-light: #8a5c37;
            --wood-header: #1c1108;
            --gold: #d8ab55;
            --gold-light: #f3d38c;
            --metal: #9aa0a6;
            --metal-light: #d4d8db;
            --metal-dark: #43484c;
            --panel-bg: #f4f4f2;
            --panel-border: #24211d;
            --ink: #2a2a2a;
            --muted: #666;
            --green: #3f8f46;
            --green-dark: #235c28;
        }

        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            font-family: 'VT323', monospace;
            letter-spacing: 0.4px;
            color: var(--ink);
            position: relative;
            background:
                url('background.png') center / cover no-repeat fixed,
                linear-gradient(180deg, #4a3016, #1c1108);
        }

        /* Darken the edges a touch so the sign stays readable on any photo */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .signboard-wrap {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ---------- Outer wood frame ---------- */
        .signboard-frame {
            position: relative;
            width: 100%;
            background:
                repeating-linear-gradient(100deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px, transparent 1px, transparent 5px),
                linear-gradient(160deg, var(--wood-light) 0%, var(--wood) 45%, var(--wood-dark) 100%);
            border-radius: 12px;
            padding: 12px;
            box-shadow:
                0 24px 48px rgba(0,0,0,0.55),
                inset 0 0 0 2px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .corner {
            position: absolute;
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, var(--metal-light), var(--metal) 45%, var(--metal-dark) 100%);
            border: 2px solid #1d2023;
            box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18), 0 2px 4px rgba(0,0,0,0.5);
        }
        .corner::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #24272a;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 1px rgba(255,255,255,0.15);
        }
        .corner.tl { top: -4px; left: -4px; border-radius: 5px 2px 2px 2px; }
        .corner.tr { top: -4px; right: -4px; border-radius: 2px 5px 2px 2px; }
        .corner.bl { bottom: -4px; left: -4px; border-radius: 2px 2px 2px 5px; }
        .corner.br { bottom: -4px; right: -4px; border-radius: 2px 2px 5px 2px; }

        /* ---------- Header plate ---------- */
        .signboard-header {
            position: relative;
            background: linear-gradient(180deg, var(--wood-header), #0f0904);
            border-radius: 7px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow:
                inset 0 0 0 1px rgba(216,171,85,0.3),
                inset 0 2px 8px rgba(0,0,0,0.65);
        }

        .ornament {
            flex: 1;
            max-width: 64px;
            height: 11px;
            border-radius: 3px;
            background-image:
                repeating-linear-gradient(45deg, var(--gold) 0 3px, transparent 3px 7px),
                repeating-linear-gradient(135deg, var(--gold) 0 3px, transparent 3px 7px);
            opacity: 0.85;
        }

        .bolt-sm {
            width: 9px;
            height: 9px;
            flex-shrink: 0;
            border-radius: 2px;
            background: linear-gradient(135deg, var(--metal-light), var(--metal-dark));
            box-shadow: 0 0 0 1px #17191b;
        }

        .title-group { text-align: center; }

        .title-group h1 {
            margin: 0;
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 26px;
            letter-spacing: 2px;
            color: var(--gold-light);
            text-shadow: 0 2px 3px rgba(0,0,0,0.85);
            text-transform: uppercase;
        }

        .brand {
            margin-top: 3px;
            font-family: 'Cinzel', serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            color: rgba(243, 211, 140, 0.65);
            text-transform: uppercase;
        }

        /* ---------- Inner panel (the form) ---------- */
        .signboard-body {
            background: rgba(12, 9, 6, 0.55);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            border-radius: 7px;
            padding: 18px 18px 16px;
            box-shadow:
                inset 0 0 0 1px rgba(216,171,85,0.18),
                0 8px 18px rgba(0,0,0,0.45);
        }

        .form-group { margin-bottom: 13px; }

        label {
            display: block;
            font-size: 19px;
            font-weight: 700;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .helper-text {
            font-size: 16px;
            margin-top: 3px;
            color: #cfc7b8;
        }

        .helper-text a {
            color: #7fd4ff;
            text-decoration: underline;
            font-weight: 600;
        }
        .helper-text a:hover { color: #a8e6ff; }

        .mc-input, select {
            width: 100%;
            padding: 8px 11px;
            font-size: 19px;
            font-family: inherit;
            background: #17171a;
            color: #f2f2f2;
            border: 1px solid #000;
            border-radius: 5px;
            outline: none;
            transition: box-shadow 0.15s ease, border-color 0.15s ease;
        }

        .mc-input:focus, select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(216, 171, 85, 0.28);
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: linear-gradient(45deg, transparent 50%, #ccc 50%), linear-gradient(135deg, #ccc 50%, transparent 50%);
            background-position: calc(100% - 16px) center, calc(100% - 11px) center;
            background-size: 5px 5px, 5px 5px;
            background-repeat: no-repeat;
        }

        .coord-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .coord-grid label {
            font-size: 15px;
            color: #d8cfbd;
            font-weight: 600;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 9px;
            cursor: pointer;
            margin: 11px 0;
            user-select: none;
            font-size: 18px;
            color: #e8e2d5;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }

        .checkbox-container input {
            width: 16px;
            height: 16px;
            accent-color: var(--green);
            cursor: pointer;
        }

        .mc-btn {
            display: block;
            width: 100%;
            padding: 12px;
            font-size: 21px;
            font-weight: 700;
            font-family: inherit;
            color: #ffffff;
            background: linear-gradient(180deg, #4a4d50, #303234);
            border: 1px solid #000;
            border-radius: 6px;
            letter-spacing: 0.6px;
            cursor: pointer;
            margin-top: 15px;
            text-align: center;
            text-transform: uppercase;
            box-shadow: 0 3px 0 #1c1d1e, 0 6px 12px rgba(0,0,0,0.35);
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
        }

        .mc-btn:hover { background: linear-gradient(180deg, #575a5d, #38393b); }
        .mc-btn:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #1c1d1e, 0 2px 6px rgba(0,0,0,0.35);
        }

        /* Progress XP Bar */
        .progress-section { display: none; margin-top: 16px; }

        .xp-bar-container {
            width: 100%;
            height: 14px;
            background: #17171a;
            border: 1px solid #000;
            border-radius: 7px;
            overflow: hidden;
        }

        .xp-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(180deg, #7fdd4a, #4b9c2a);
            transition: width 0.1s ease-out;
        }

        .status-text {
            font-size: 16px;
            color: #d8cfbd;
            margin-top: 6px;
            display: flex;
            justify-content: space-between;
        }

        /* Output Cards */
        .results-box {
            margin-top: 16px;
            background: #17171a;
            border: 1px solid #000;
            border-radius: 6px;
            padding: 12px;
            max-height: 220px;
            overflow-y: auto;
            color: #f2f2f2;
            font-size: 18px;
        }

        .results-box::-webkit-scrollbar { width: 9px; }
        .results-box::-webkit-scrollbar-track { background: #111; }
        .results-box::-webkit-scrollbar-thumb { background: #3d3d3d; border-radius: 5px; }

        .result-card {
            background: #232326;
            border: 1px solid #38383b;
            border-left: 3px solid var(--gold);
            border-radius: 5px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            transition: transform 0.1s ease;
        }
        .result-card:hover { transform: translateX(2px); }
        .result-card:last-child { margin-bottom: 0; }
        .result-info { font-size: 18px; line-height: 1.3; }

        .copy-btn {
            background: var(--green);
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 7px 12px;
            font-size: 16px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 2px 0 var(--green-dark);
        }
        .copy-btn:hover { filter: brightness(1.08); }
        .copy-btn:active { transform: translateY(2px); box-shadow: none; }

        /* ---------- Post legs (hanging sign feel) ---------- */
        .post-legs {
            width: 62%;
            max-width: 320px;
            display: flex;
            justify-content: space-between;
            margin-top: -8px;
            z-index: -1;
        }

        .post-leg {
            width: 20px;
            height: 54px;
            background: linear-gradient(180deg, var(--wood-light), var(--wood-dark));
            border-radius: 0 0 4px 4px;
            box-shadow: 0 14px 16px rgba(0,0,0,0.45);
        }

        @media (max-width: 480px) {
            .signboard-body { padding: 15px; }
            .mc-input, select, .checkbox-container, .status-text, .results-box { font-size: 16px; }
            .title-group h1 { font-size: 20px; letter-spacing: 1px; }
            .ornament { max-width: 34px; }
            .coord-grid { grid-template-columns: 1fr; }
            .result-card { flex-direction: column; align-items: flex-start; }
            .copy-btn { width: 100%; text-align: center; }
            .post-legs { width: 40%; }
        }
    </style>
</head>
<body>

<div class="signboard-wrap">
    <div class="signboard-frame">
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>

        <div class="signboard-header">
            <span class="ornament"></span>
            <span class="bolt-sm"></span>
            <div class="title-group">
                <h1>Item Locator</h1>
                <div class="brand">LostShulker.com</div>
            </div>
            <span class="bolt-sm"></span>
            <span class="ornament"></span>
        </div>

        <div class="signboard-body">
            <div class="form-group">
                <label for="itemId">Target Item ID:</label>
                <input type="text" id="itemId" class="mc-input" value="minecraft:yellow_shulker_box" placeholder="e.g. minecraft:yellow_shulker_box">
                <div class="helper-text">
                    Don't know the exact ID? <a href="https://minecraftitemids.com/" target="_blank" rel="noopener">Browse Minecraft Item IDs here</a>
                </div>
            </div>

            <div class="form-group">
                <label for="dimension">Dimension:</label>
                <select id="dimension" class="mc-input">
                    <option value="overworld">Overworld</option>
                    <option value="nether">The Nether</option>
                    <option value="end">The End</option>
                </select>
            </div>

            <div class="form-group" id="areaConfig">
                <label>Search Area:</label>
                <div class="coord-grid">
                    <div>
                        <label for="centerX">Center X:</label>
                        <input type="number" id="centerX" class="mc-input" value="0">
                    </div>
                    <div>
                        <label for="centerZ">Center Z:</label>
                        <input type="number" id="centerZ" class="mc-input" value="0">
                    </div>
                    <div>
                        <label for="radius">Radius (Blocks):</label>
                        <input type="number" id="radius" class="mc-input" value="3000" min="500" step="500">
                    </div>
                </div>
            </div>

            <label class="checkbox-container">
                <input type="checkbox" id="scanAll">
                <span>Scan entire loaded world (Expands outward from Center X/Z)</span>
            </label>

            <label class="checkbox-container">
                <input type="checkbox" id="searchContainers" checked>
                <span>Search inside chests / containers (Uncheck for placed blocks)</span>
            </label>

            <button id="scanBtn" class="mc-btn">Select World Folder &amp; Search</button>

            <div class="progress-section" id="progressSection">
                <div class="xp-bar-container">
                    <div class="xp-bar-fill" id="xpBar"></div>
                </div>
                <div class="status-text">
                    <span id="statusCurrent">Initializing scanner...</span>
                    <span id="statusCount">0 / 0</span>
                </div>
            </div>

            <div class="results-box" id="results">Awaiting world folder...</div>
        </div>
    </div>

    <div class="post-legs">
        <div class="post-leg"></div>
        <div class="post-leg"></div>
    </div>
</div>

<script type="module">
    import * as NBT from "https://cdn.jsdelivr.net/npm/nbtify@2.2.0/+esm";

    const scanBtn = document.getElementById('scanBtn');
    const resultsDiv = document.getElementById('results');
    const progressSection = document.getElementById('progressSection');
    const xpBar = document.getElementById('xpBar');
    const statusCurrent = document.getElementById('statusCurrent');
    const statusCount = document.getElementById('statusCount');
    const scanAllCheckbox = document.getElementById('scanAll');
    const areaConfig = document.getElementById('areaConfig');
    const radiusInput = document.getElementById('radius');

    // Toggle radius visibility when "Scan entire world" is checked
    scanAllCheckbox.addEventListener('change', (e) => {
        radiusInput.style.opacity = e.target.checked ? '0.4' : '1';
        radiusInput.style.pointerEvents = e.target.checked ? 'none' : 'auto';
    });

    async function decompressChunk(compressedBytes, compressionType) {
        if (compressionType === 3) return compressedBytes;
        const format = compressionType === 1 ? 'gzip' : 'deflate';
        const stream = new Blob([compressedBytes]).stream().pipeThrough(new DecompressionStream(format));
        return await new Response(stream).arrayBuffer();
    }

    async function findRegionDir(rootDirHandle, dimension) {
        const pathsToTry = {
            overworld: [
                ['dimensions', 'minecraft', 'overworld', 'region'],
                ['region'],
                []
            ],
            nether: [
                ['dimensions', 'minecraft', 'the_nether', 'region'],
                ['dimensions', 'minecraft', 'nether', 'region'],
                ['DIM-1', 'region'],
                ['region']
            ],
            end: [
                ['dimensions', 'minecraft', 'the_end', 'region'],
                ['dimensions', 'minecraft', 'end', 'region'],
                ['DIM1', 'region'],
                ['region']
            ]
        };

        for (const path of pathsToTry[dimension]) {
            try {
                let current = rootDirHandle;
                for (const segment of path) {
                    current = await current.getDirectoryHandle(segment);
                }
                for await (const entry of current.values()) {
                    if (entry.name.endsWith('.mca')) return current;
                }
            } catch (e) {}
        }
        return null;
    }

    // Clean Helper Function to add results to the UI
    function addResultCard(title, x, y, z, isApproximate = false) {
        const coordText = isApproximate
            ? `<span style="color:#ffaa00">Chunk: ~${x}, ~${y}, ~${z}</span>`
            : `X: ${x}, Y: ${y}, Z: ${z}`;

        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
            <div class="result-info">
                <b style="color:#e0b25a">${title}</b><br>
                Coordinates: <span style="color:#7ed957">${coordText}</span>
            </div>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('/tp @s ${x} ${y} ${z}'); this.innerText='COPIED!'; setTimeout(()=>this.innerText='COPY /TP', 1500)">COPY /TP</button>
        `;
        resultsDiv.appendChild(card);

        // Auto-scroll to the newest result so they don't miss it
        resultsDiv.scrollTop = resultsDiv.scrollHeight;
    }

    scanBtn.addEventListener('click', async () => {
        const targetItem = document.getElementById('itemId').value.trim();
        const dimension = document.getElementById('dimension').value;
        const centerX = parseInt(document.getElementById('centerX').value) || 0;
        const centerZ = parseInt(document.getElementById('centerZ').value) || 0;
        const radius = parseInt(document.getElementById('radius').value) || 3000;
        const scanAll = scanAllCheckbox.checked;
        const searchContainers = document.getElementById('searchContainers').checked;

        if (!targetItem) {
            alert('Please specify an item ID!');
            return;
        }

        try {
            const rootDirHandle = await window.showDirectoryPicker({ mode: 'read' });

            progressSection.style.display = 'block';
            resultsDiv.innerHTML = '<span style="color:#ffff55;">Scanning directory structure...</span>';
            xpBar.style.width = '0%';

            const regionHandle = await findRegionDir(rootDirHandle, dimension);
            if (!regionHandle) {
                resultsDiv.innerHTML = `<span style="color:#ff5555;">❌ Could not locate region files for dimension: ${dimension}</span>`;
                progressSection.style.display = 'none';
                return;
            }

            const minSearchX = centerX - radius;
            const maxSearchX = centerX + radius;
            const minSearchZ = centerZ - radius;
            const maxSearchZ = centerZ + radius;

            const regionFiles = [];
            for await (const entry of regionHandle.values()) {
                if (entry.kind === 'file' && entry.name.endsWith('.mca')) {
                    const parts = entry.name.split('.');
                    if (parts.length === 4) {
                        const regX = parseInt(parts[1]);
                        const regZ = parseInt(parts[2]);

                        const minX = regX * 512;
                        const maxX = minX + 511;
                        const minZ = regZ * 512;
                        const maxZ = minZ + 511;

                        // Calculate distance from Center X/Z for sorting
                        const regCenterX = regX * 512 + 256;
                        const regCenterZ = regZ * 512 + 256;
                        const distSq = Math.pow(regCenterX - centerX, 2) + Math.pow(regCenterZ - centerZ, 2);

                        const fileData = { entry, distSq };

                        if (scanAll) {
                            regionFiles.push(fileData);
                        } else {
                            if (!(maxX < minSearchX || minX > maxSearchX || maxZ < minSearchZ || minZ > maxSearchZ)) {
                                regionFiles.push(fileData);
                            }
                        }
                    }
                }
            }

            // SORT FILES OUTWARD FROM CENTER COORDINATES
            regionFiles.sort((a, b) => a.distSq - b.distSq);

            if (regionFiles.length === 0) {
                resultsDiv.innerHTML = '<span style="color:#ffaa00;">No region files found matching that area!</span>';
                progressSection.style.display = 'none';
                return;
            }

            // Set the active scanning UI
            resultsDiv.innerHTML = `
                <div style="color:#aaaaaa; font-size:13px; margin-bottom: 8px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 8px;">
                    <i>(Items will appear here immediately as they are found...)</i>
                </div>
            `;

            let foundCount = 0;

            for (let fIdx = 0; fIdx < regionFiles.length; fIdx++) {
                const fileEntry = regionFiles[fIdx].entry;
                const pct = Math.round(((fIdx + 1) / regionFiles.length) * 100);

                xpBar.style.width = `${pct}%`;
                statusCurrent.innerText = `Scanning: ${fileEntry.name}`;
                statusCount.innerText = `${fIdx + 1} / ${regionFiles.length} files`;

                const file = await fileEntry.getFile();
                const arrayBuffer = await file.arrayBuffer();
                const dataView = new DataView(arrayBuffer);

                for (let i = 0; i < 1024; i++) {
                    const offsetInfo = dataView.getUint32(i * 4);
                    const offset = (offsetInfo >>> 8) * 4096;
                    const sectors = offsetInfo & 0xFF;
                    if (offset === 0 || sectors === 0) continue;

                    try {
                        const chunkLength = dataView.getUint32(offset);
                        const compressionType = dataView.getUint8(offset + 4);
                        const compressedData = arrayBuffer.slice(offset + 5, offset + 4 + chunkLength);

                        const decompressed = await decompressChunk(compressedData, compressionType);
                        const nbtData = await NBT.read(decompressed);
                        const root = nbtData.data;

                        // 1. Search Block Entities (Chests, placed Shulkers, Furnaces, etc.)
                        const blockEntities = root.block_entities || (root.Level && root.Level.TileEntities);
                        if (blockEntities) {
                            for (const be of blockEntities) {
                                if (searchContainers) {
                                    // Search INSIDE containers
                                    if (be.Items && Array.isArray(be.Items)) {
                                        for (const item of be.Items) {
                                            if (item.id === targetItem || item.id === `minecraft:${targetItem}`) {
                                                foundCount++;
                                                const containerType = (be.id || 'container').replace('minecraft:', '');
                                                addResultCard(`📦 Inside ${containerType.toUpperCase()}`, be.x, be.y, be.z);
                                                break;
                                            }
                                        }
                                    }
                                } else {
                                    // Check if the block entity ITSELF is the target
                                    if (be.id === targetItem || be.id === `minecraft:${targetItem}`) {
                                        foundCount++;
                                        addResultCard(`🧱 Placed Block Entity`, be.x, be.y, be.z);
                                    }
                                }
                            }
                        }

                        // 2. Search Chunk Palette for Standard Blocks (Diamond Ore, etc.) if not searching chests
                        if (!searchContainers) {
                            const sections = root.sections || (root.Level && root.Level.Sections);
                            if (sections) {
                                // Extract chunk coordinates
                                const chunkX = root.xPos !== undefined ? root.xPos : (root.Level && root.Level.xPos);
                                const chunkZ = root.zPos !== undefined ? root.zPos : (root.Level && root.Level.zPos);

                                for (const sec of sections) {
                                    const palette = sec.block_states?.palette || sec.Palette;
                                    if (palette) {
                                        for (const p of palette) {
                                            if (p.Name === targetItem || p.Name === `minecraft:${targetItem}`) {
                                                foundCount++;
                                                const approxX = chunkX * 16;
                                                const approxY = sec.Y * 16;
                                                const approxZ = chunkZ * 16;

                                                // Passes 'true' at the end to signify chunk approximation
                                                addResultCard(`⛏️ Standard Block`, approxX, approxY, approxZ, true);
                                                break; // Found in this sub-chunk, move on to prevent spam
                                            }
                                        }
                                    }
                                }
                            }
                        }

                    } catch (e) {
                        // Silently skip corrupted chunks
                    }
                }
            }

            statusCurrent.innerText = `Scan Complete!`;
            if (foundCount === 0) {
                resultsDiv.innerHTML = '<span style="color:#ff5555;">No matching items were found in the selected area.</span>';
            }

        } catch (error) {
            if (error.name !== 'AbortError') {
                resultsDiv.innerHTML = `<span style="color:#ff5555;">Error: ${error.message}</span>`;
            }
            progressSection.style.display = 'none';
        }
    });
</script>
